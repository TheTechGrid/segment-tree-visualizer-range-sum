<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Segment Tree</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 30px; }
    
    /* Layout & Controls */
    .panel { background: #f5f5f5; border-radius: 8px; padding: 15px; margin: 10px auto; max-width: 700px; display: flex; justify-content: center; gap: 15px; align-items: center; }
    input[type="text"] { width: 250px; padding: 6px; }
    input[type="number"] { width: 70px; padding: 6px; }
    button { padding: 8px 16px; cursor: pointer; background: #2196F3; color: white; border: none; border-radius: 4px; font-weight: bold; }
    button:hover { background: #1976D2; }
    
    /* Error Banner */
    #error-banner { display: none; background: #ffebee; color: #c62828; padding: 12px; margin: 10px auto; max-width: 700px; border-radius: 4px; border-left: 5px solid #c62828; font-weight: bold; }

    /* SVG Tree Styles */
    .node circle { fill: #fff; stroke-width: 3px; transition: all 0.4s ease; }
    .node text { font: 12px sans-serif; fill: #333; pointer-events: none; }
    .link { fill: none; stroke: #ccc; stroke-width: 2px; }
    
    /* Highlight class for changed nodes */
    .changed circle { stroke: #FF5722 !important; stroke-width: 5px !important; fill: #fff3e0 !important; }
  </style>
</head>
<body>
  <h2>Segment Tree (Sum)</h2>

  <!-- Setup Panel -->
  <div class="panel">
    <label>Define Array (comma-separated): 
      <input type="text" id="arrInput" value="1, 3, 5, 7, 9, 11" placeholder="e.g. 1, 2, 3">
    </label>
    <button onclick="buildNewTree()">Build Tree</button>
  </div>

  <!-- Error Banner -->
  <div id="error-banner"></div>

  <!-- Update Panel -->
  <div class="panel" id="update-panel">
    <label>Index: <input type="number" id="idxInput" min="0" value="1"></label>
    <label>New Value: <input type="number" id="valInput" value="10"></label>
    <button onclick="updateValue()">Update Node</button>
  </div>

  <div id="tree-container"></div>

  <script>
    let arr = [1, 3, 5, 7, 9, 11];
    let oldArr = null; // Used to track changes for highlighting

    // --- 1. Validation & Initialization Flow ---
    function showError(msg) {
      const banner = document.getElementById("error-banner");
      banner.innerText = msg;
      banner.style.display = "block";
    }

    function hideError() {
      document.getElementById("error-banner").style.display = "none";
    }

    function buildNewTree() {
      hideError();
      const rawText = document.getElementById("arrInput").value;
      
      // Validation 1: Empty input
      if (!rawText.trim()) {
        return showError("Array cannot be empty.");
      }

      const parsedArr = rawText.split(',').map(s => parseInt(s.trim(), 10));

      // Validation 2: Invalid numbers
      if (parsedArr.some(isNaN)) {
        return showError("Invalid input! Please use only numbers separated by commas.");
      }

      // Validation 3: Array bounds (prevent massive trees crashing the browser)
      if (parsedArr.length < 1 || parsedArr.length > 16) {
        return showError("Array size must be between 1 and 16 elements.");
      }

      // If valid, update state
      arr = parsedArr;
      oldArr = null; // Reset old array so nothing highlights on initial build
      
      // Update max index constraint on the update input
      document.getElementById("idxInput").max = arr.length - 1;
      document.getElementById("idxInput").value = 0;

      renderTree();
    }

    // --- 2. Update Flow (with state tracking) ---
    function updateValue() {
      hideError();
      const idx = parseInt(document.getElementById("idxInput").value, 10);
      const val = parseInt(document.getElementById("valInput").value, 10);
      
      if (isNaN(idx) || idx < 0 || idx >= arr.length || isNaN(val)) {
        return showError(`Invalid update! Index must be between 0 and ${arr.length - 1}.`);
      }

      // Save a copy of the current array to compare against during render
      oldArr = [...arr];
      
      // Update the underlying array
      arr[idx] = val;    
      renderTree();      
    }

    // --- 3. Tree Data Construction (Determines what changed) ---
    function getSum(array, l, r) {
      let sum = 0;
      for (let i = l; i <= r; i++) sum += array[i];
      return sum;
    }

    function buildTreeData(l, r) {
      const currentSum = getSum(arr, l, r);
      let isChanged = false;

      // Check if this segment's sum differs from the previous state
      if (oldArr && oldArr.length === arr.length) {
        const previousSum = getSum(oldArr, l, r);
        if (currentSum !== previousSum) isChanged = true;
      }

      // Base Case: Leaf node
      if (l === r) {
        return { name: `[${l}]: ${currentSum}`, changed: isChanged };
      }
      
      // Recursive Case: Internal node
      const mid = Math.floor((l + r) / 2);
      const left = buildTreeData(l, mid);
      const right = buildTreeData(mid + 1, r);
      
      return { 
        name: `Sum: ${currentSum}`, 
        children: [left, right], 
        changed: isChanged 
      };
    }

    // --- 4. D3 Rendering ---
    function renderTree() {
      d3.select("#tree-container").html("");
      if (arr.length === 0) return;

      const treeData = buildTreeData(0, arr.length - 1);

      // Dynamically scale width based on number of nodes (roughly)
      const width = Math.max(800, arr.length * 60); 
      const height = 450;
      
      const svg = d3.select("#tree-container").append("svg")
                    .attr("width", width).attr("height", height)
                    .append("g").attr("transform", "translate(40,40)");

      const root = d3.hierarchy(treeData);
      const treeLayout = d3.tree().size([width - 80, height - 80]);
      treeLayout(root);

      // Draw Edges
      svg.selectAll('.link').data(root.links()).enter().append('path')
         .attr('class', 'link')
         .attr('d', d3.linkVertical().x(d => d.x).y(d => d.y));

      // Draw Nodes
      const node = svg.selectAll('.node').data(root.descendants()).enter().append('g')
          // Apply the 'changed' CSS class if this node was flagged during data construction
          .attr('class', d => d.data.changed ? 'node changed' : 'node')
          .attr('transform', d => `translate(${d.x},${d.y})`);
                      
      node.append('circle')
          .attr('r', 28)
          // Default stroke color (overridden by .changed class if applicable)
          .style('stroke', '#2196F3'); 

      node.append('text')
          .attr('dy', 4)
          .attr('text-anchor', 'middle')
          .text(d => d.data.name);
    }

    // Initialize on load
    document.getElementById("idxInput").max = arr.length - 1;
    renderTree();
  </script>
</body>
</html>
