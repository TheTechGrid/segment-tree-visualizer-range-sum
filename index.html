<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Segment Tree Visualizer</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 50px; }
    .node circle { fill: #fff; stroke: #2196F3; stroke-width: 3px; }
    .node text { font: 12px sans-serif; fill: #333; pointer-events: none; }
    .link { fill: none; stroke: #ccc; stroke-width: 2px; }
    .controls { margin-bottom: 30px; padding: 15px; background: #f5f5f5; border-radius: 8px; display: inline-block; }
    input { width: 60px; padding: 5px; margin-right: 15px; }
    button { padding: 6px 12px; cursor: pointer; background: #2196F3; color: white; border: none; border-radius: 4px; }
    button:hover { background: #1976D2; }
  </style>
</head>
<body>
  <h2>Segment Tree (Sum)</h2>
  
  <!-- 1. The Input Controls -->
  <div class="controls">
    <label>Index (0-5): <input type="number" id="idxInput" min="0" max="5" value="1"></label>
    <label>New Value: <input type="number" id="valInput" value="10"></label>
    <button onclick="updateValue()">Update Tree</button>
  </div>

  <div id="tree-container"></div>

  <script>
    // The underlying array
    const arr = [1, 3, 5, 7, 9, 11];
    
    // Recursively build hierarchical data
    function buildTreeData(l, r) {
      if (l === r) return { name: `[${l}]: ${arr[l]}`, value: arr[l] };
      const mid = Math.floor((l + r) / 2);
      const left = buildTreeData(l, mid);
      const right = buildTreeData(mid + 1, r);
      const sum = left.value + right.value;
      return { name: `Sum: ${sum}`, value: sum, children: [left, right] };
    }
    
    // 2. The Render Function (clears and redraws)
    function renderTree() {
      // Clear the previous SVG before drawing the new one
      d3.select("#tree-container").html("");

      const treeData = buildTreeData(0, arr.length - 1);

      const width = 800, height = 400;
      const svg = d3.select("#tree-container").append("svg")
                    .attr("width", width).attr("height", height)
                    .append("g").attr("transform", "translate(40,40)");

      const root = d3.hierarchy(treeData);
      const treeLayout = d3.tree().size([width - 80, height - 80]);
      treeLayout(root);

      svg.selectAll('.link').data(root.links()).enter().append('path')
         .attr('class', 'link')
         .attr('d', d3.linkVertical().x(d => d.x).y(d => d.y));

      const node = svg.selectAll('.node').data(root.descendants()).enter().append('g')
                      .attr('class', 'node')
                      .attr('transform', d => `translate(${d.x},${d.y})`);
                      
      node.append('circle').attr('r', 25);
      node.append('text').attr('dy', 4).attr('text-anchor', 'middle').text(d => d.data.name);
    }

    // 3. The Update Logic
    function updateValue() {
      // Read the values from the input fields
      const idx = parseInt(document.getElementById("idxInput").value);
      const val = parseInt(document.getElementById("valInput").value);
      
      // Validate inputs and update array
      if (idx >= 0 && idx < arr.length && !isNaN(val)) {
        arr[idx] = val;    // Update the underlying array
        renderTree();      // Trigger a redraw
      } else {
        alert("Please enter a valid index (0 to " + (arr.length - 1) + ") and a valid number.");
      }
    }

    // Initial render when the page first loads
    renderTree();
  </script>
</body>
</html>
