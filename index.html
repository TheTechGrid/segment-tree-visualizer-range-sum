<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Segment Tree Visualizer</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 50px; }
    .node circle { fill: #fff; stroke: #2196F3; stroke-width: 3px; }
    .node text { font: 12px sans-serif; fill: #333; pointer-events: none; }
    .link { fill: none; stroke: #ccc; stroke-width: 2px; }
  </style>
</head>
<body>
  <h2>Segment Tree (Sum)</h2>
  <div id="tree-container"></div>

  <script>
    // 1. Define array and recursively build hierarchical data
    const arr = [1, 3, 5, 7, 9, 11];
    
    function buildTreeData(l, r) {
      if (l === r) return { name: `[${l}]: ${arr[l]}`, value: arr[l] };
      const mid = Math.floor((l + r) / 2);
      const left = buildTreeData(l, mid);
      const right = buildTreeData(mid + 1, r);
      const sum = left.value + right.value;
      return { name: `Sum: ${sum}`, value: sum, children: [left, right] };
    }
    
    const treeData = buildTreeData(0, arr.length - 1);

    // 2. Setup D3 Canvas
    const width = 800, height = 400;
    const svg = d3.select("#tree-container").append("svg")
                  .attr("width", width).attr("height", height)
                  .append("g").attr("transform", "translate(40,40)");

    // 3. Generate Tree Layout
    const root = d3.hierarchy(treeData);
    const treeLayout = d3.tree().size([width - 80, height - 80]);
    treeLayout(root);

    // 4. Draw Links (Edges)
    svg.selectAll('.link').data(root.links()).enter().append('path')
       .attr('class', 'link')
       .attr('d', d3.linkVertical().x(d => d.x).y(d => d.y));

    // 5. Draw Nodes
    const node = svg.selectAll('.node').data(root.descendants()).enter().append('g')
                    .attr('class', 'node')
                    .attr('transform', d => `translate(${d.x},${d.y})`);
                    
    node.append('circle').attr('r', 25);
    node.append('text').attr('dy', 4).attr('text-anchor', 'middle').text(d => d.data.name);
  </script>
</body>
</html>
