<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Segment Tree - Dark Mode</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    /* Dark Mode Theme */
    body { 
      font-family: sans-serif; 
      text-align: center; 
      margin-top: 30px; 
      background-color: #121212; 
      color: #e0e0e0; 
    }
    
    /* Layout & Controls */
    .panel { 
      background: #1e1e1e; 
      border: 1px solid #333;
      border-radius: 8px; 
      padding: 15px; 
      margin: 10px auto; 
      max-width: 800px; 
      display: flex; 
      flex-direction: column; /* Stack vertically for labels */
      justify-content: center; 
      gap: 10px; 
      align-items: center; 
    }
    
    .panel-row {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .help-text {
      font-size: 12px;
      color: #888;
      margin-bottom: 5px;
    }
    
    input[type="text"], input[type="number"] { 
      background: #2c2c2c; 
      color: #e0e0e0;
      border: 1px solid #555;
      border-radius: 4px;
    }
    input[type="text"] { width: 300px; padding: 6px; }
    input[type="number"] { width: 80px; padding: 6px; }
    
    button { 
      padding: 8px 16px; 
      cursor: pointer; 
      background: #3b82f6; 
      color: white; 
      border: none; 
      border-radius: 4px; 
      font-weight: bold; 
      transition: background 0.2s;
    }
    button:hover { background: #2563eb; }
    
    /* Error Banner */
    #error-banner { 
      display: none; 
      background: #3f1014; 
      color: #ff8a8a; 
      padding: 12px; 
      margin: 10px auto; 
      max-width: 800px; 
      border-radius: 4px; 
      border-left: 5px solid #d32f2f; 
      font-weight: bold; 
    }

    /* SVG Tree Styles for Dark Mode */
    .node circle { 
      fill: #1e1e1e; 
      stroke-width: 3px; 
      transition: all 0.4s ease; 
    }
    
    .node text.main-text { 
      font: 12px sans-serif; 
      fill: #e0e0e0; 
      pointer-events: none; 
    }
    
    .node text.prev-text {
      font: 10px sans-serif;
      fill: #888888; 
      pointer-events: none;
    }

    .link { 
      fill: none; 
      stroke: #444; 
      stroke-width: 2px; 
    }
    
    /* Highlight class for changed nodes */
    .changed circle { 
      stroke: #ffb74d !important; 
      stroke-width: 4px !important; 
      fill: #2d2417 !important; 
    }
  </style>
</head>
<body>
  <h2>Segment Tree (Sum)</h2>

  <!-- Setup Panel -->
  <div class="panel">
    <div class="help-text">Limits: 1 to 16 elements. Values must be whole numbers between -999 and +999.</div>
    <div class="panel-row">
      <label>Array: 
        <input type="text" id="arrInput" value="1, 3, 5, 7, 9, 11" placeholder="e.g. 1, 2, 3">
      </label>
      <button onclick="buildNewTree()">Build Tree</button>
    </div>
  </div>

  <!-- Error Banner -->
  <div id="error-banner"></div>

  <!-- Update Panel -->
  <div class="panel" id="update-panel">
    <div class="help-text">Update limits: Value must be between -999 and +999.</div>
    <div class="panel-row">
      <label>Index: <input type="number" id="idxInput" min="0" value="1"></label>
      <label>New Value: <input type="number" id="valInput" value="10" min="-999" max="999"></label>
      <button onclick="updateValue()">Update Node</button>
    </div>
  </div>

  <div id="tree-container"></div>

  <script>
    let arr = [1, 3, 5, 7, 9, 11];
    let oldArr = null; 

    // Helper strict regex for valid whole numbers (allows starting '-')
    const isValidInteger = (str) => /^-?\d+$/.test(str);

    function showError(msg) {
      const banner = document.getElementById("error-banner");
      banner.innerText = msg;
      banner.style.display = "block";
    }

    function hideError() {
      document.getElementById("error-banner").style.display = "none";
    }

    function buildNewTree() {
      hideError();
      const rawText = document.getElementById("arrInput").value;
      
      if (!rawText.trim()) return showError("Array cannot be empty.");

      const rawItems = rawText.split(',');
      const parsedArr = [];

      for (let i = 0; i < rawItems.length; i++) {
        const s = rawItems[i].trim();
        if (s === "") continue; // Skip empty spaces between commas

        // Strict validation: Reject trailing symbols like "5=" or "4-"
        if (!isValidInteger(s)) {
          return showError(`Invalid input at item "${s}". Please use only whole numbers without extra symbols.`);
        }

        const num = parseInt(s, 10);

        // Min/Max limit validation
        if (num < -999 || num > 999) {
          return showError(`Value ${num} is out of bounds. Must be between -999 and 999.`);
        }

        parsedArr.push(num);
      }

      // Size limit validation
      if (parsedArr.length < 1 || parsedArr.length > 16) {
        return showError("Array size must be between 1 and 16 elements.");
      }

      arr = parsedArr;
      oldArr = null; 
      
      document.getElementById("idxInput").max = arr.length - 1;
      document.getElementById("idxInput").value = 0;

      renderTree();
    }

    function updateValue() {
      hideError();
      const idxStr = document.getElementById("idxInput").value.trim();
      const valStr = document.getElementById("valInput").value.trim();
      
      // Strict regex validation for update fields
      if (!isValidInteger(idxStr) || !isValidInteger(valStr)) {
         return showError("Invalid update format! Ensure both index and value are pure numbers.");
      }

      const idx = parseInt(idxStr, 10);
      const val = parseInt(valStr, 10);
      
      if (idx < 0 || idx >= arr.length) {
        return showError(`Index must be between 0 and ${arr.length - 1}.`);
      }
      
      if (val < -999 || val > 999) {
        return showError("New value must be between -999 and 999.");
      }

      oldArr = [...arr];
      arr[idx] = val;    
      renderTree();      
    }

    function getSum(array, l, r) {
      let sum = 0;
      for (let i = l; i <= r; i++) sum += array[i];
      return sum;
    }

    function buildTreeData(l, r) {
      const currentSum = getSum(arr, l, r);
      let isChanged = false;
      let prevSum = null;

      if (oldArr && oldArr.length === arr.length) {
        const previousSum = getSum(oldArr, l, r);
        if (currentSum !== previousSum) {
          isChanged = true;
          prevSum = previousSum;
        }
      }

      if (l === r) {
        return { name: `[${l}]: ${currentSum}`, changed: isChanged, prevSum: prevSum };
      }
      
      const mid = Math.floor((l + r) / 2);
      const left = buildTreeData(l, mid);
      const right = buildTreeData(mid + 1, r);
      
      return { 
        name: `Sum: ${currentSum}`, 
        children: [left, right], 
        changed: isChanged,
        prevSum: prevSum
      };
    }

    function renderTree() {
      d3.select("#tree-container").html("");
      if (arr.length === 0) return;

      const treeData = buildTreeData(0, arr.length - 1);

      const width = Math.max(800, arr.length * 60); 
      const height = 480;
      
      const svg = d3.select("#tree-container").append("svg")
                    .attr("width", width).attr("height", height)
                    .append("g").attr("transform", "translate(40,40)");

      const root = d3.hierarchy(treeData);
      const treeLayout = d3.tree().size([width - 80, height - 80]);
      treeLayout(root);

      svg.selectAll('.link').data(root.links()).enter().append('path')
         .attr('class', 'link')
         .attr('d', d3.linkVertical().x(d => d.x).y(d => d.y));

      const node = svg.selectAll('.node').data(root.descendants()).enter().append('g')
          .attr('class', d => d.data.changed ? 'node changed' : 'node')
          .attr('transform', d => `translate(${d.x},${d.y})`);
                      
      node.append('circle')
          .attr('r', 35) 
          .style('stroke', '#4fc3f7'); 

      node.append('text')
          .attr('class', 'main-text')
          .attr('dy', d => d.data.changed ? -4 : 4)
          .attr('text-anchor', 'middle')
          .text(d => d.data.name);

      node.filter(d => d.data.changed).append('text')
          .attr('class', 'prev-text')
          .attr('dy', 14)
          .attr('text-anchor', 'middle')
          .text(d => `(was ${d.data.prevSum})`);
    }

    document.getElementById("idxInput").max = arr.length - 1;
    renderTree();
  </script>
</body>
</html>
