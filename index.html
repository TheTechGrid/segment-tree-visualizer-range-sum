<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Segment Tree - Dark Mode</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    /* Dark Mode Theme */
    body { 
      font-family: sans-serif; 
      text-align: center; 
      margin-top: 30px; 
      background-color: #121212; 
      color: #e0e0e0; 
    }

    /* Advanced Mode Button Banner */
    .advanced-banner {
      margin-bottom: 25px;
    }
    
    .btn-advanced {
      display: inline-block;
      text-decoration: none;
      padding: 10px 20px;
      font-weight: bold;
      color: white;
      background: linear-gradient(135deg, #8e2de2, #4a00e0);
      border-radius: 20px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .btn-advanced:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(142, 45, 226, 0.4);
    }
    
    /* Layout & Controls */
    .panel { 
      background: #1e1e1e; 
      border: 1px solid #333;
      border-radius: 8px; 
      padding: 15px; 
      margin: 10px auto; 
      max-width: 850px; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      gap: 10px; 
      align-items: center; 
    }
    
    .panel-row {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .help-text {
      font-size: 12px;
      color: #888;
      margin-bottom: 5px;
    }

    .legend-text {
      font-size: 11px;
      color: #aaa;
      margin-top: 5px;
    }
    .legend-text span { margin: 0 5px; }
    .legend-match { color: #81c784; font-weight: bold; }
    .legend-partial { color: #ffb74d; font-weight: bold; }
    
    input[type="text"], input[type="number"] { 
      background: #2c2c2c; 
      color: #e0e0e0;
      border: 1px solid #555;
      border-radius: 4px;
    }
    input[type="text"] { width: 300px; padding: 6px; }
    input[type="number"] { width: 70px; padding: 6px; }
    
    button { 
      padding: 8px 16px; 
      cursor: pointer; 
      background: #3b82f6; 
      color: white; 
      border: none; 
      border-radius: 4px; 
      font-weight: bold; 
      transition: background 0.2s;
    }
    button:hover { background: #2563eb; }
    
    .btn-query { background: #4caf50; }
    .btn-query:hover { background: #388e3c; }

    #query-result {
      font-size: 16px;
      font-weight: bold;
      color: #81c784;
      min-width: 100px;
      text-align: left;
    }

    /* Error Banner */
    #error-banner { 
      display: none; 
      background: #3f1014; 
      color: #ff8a8a; 
      padding: 12px; 
      margin: 10px auto; 
      max-width: 850px; 
      border-radius: 4px; 
      border-left: 5px solid #d32f2f; 
      font-weight: bold; 
    }

    /* Container for large trees */
    #tree-container {
      overflow-x: auto; 
      max-width: 100vw;
      margin: 0 auto;
      padding-bottom: 20px;
    }

    /* SVG Tree Styles for Dark Mode */
    .node circle { 
      fill: #1e1e1e; 
      stroke-width: 3px; 
      transition: all 0.4s ease; 
    }
    
    .node text.range-text { font: 10px sans-serif; fill: #90caf9; pointer-events: none; }
    .node text.main-text { font: 14px sans-serif; font-weight: bold; fill: #e0e0e0; pointer-events: none; }
    .node text.prev-text { font: 10px sans-serif; fill: #888888; pointer-events: none; }
    
    .link { fill: none; stroke: #444; stroke-width: 2px; transition: stroke 0.4s; }

    /* Highlight class for UPDATED nodes */
    .changed circle { stroke: #ffb74d !important; stroke-width: 4px !important; fill: #2d2417 !important; }
    
    /* Highlight classes for QUERY PATH nodes */
    .q-match circle { stroke: #81c784 !important; stroke-width: 5px !important; fill: #1b3320 !important; }
    .q-partial circle { stroke: #ffb74d !important; stroke-width: 4px !important; stroke-dasharray: 6, 4; }
    .q-miss circle { stroke: #444 !important; fill: #121212 !important; }
    .q-miss text { fill: #555 !important; }
  </style>
</head>
<body>
  <h2 style="margin-bottom: 10px;">Segment Tree (Sum)</h2>
  
  <div class="advanced-banner">
    <a href="https://thetechgrid.github.io/segment-tree-lazy-visualizer-range-sum" class="btn-advanced">
      🚀 Advanced Mode: Lazy Propagation Visualizer 
    </a>
  </div>

  <!-- Setup Panel -->
  <div class="panel">
    <div class="help-text">Limits: 1 to 16 elements. Values must be whole numbers between -999 and +999.</div>
    <div class="panel-row">
      <label>Array: 
        <input type="text" id="arrInput" value="1, 3, 5, 7, 9, 11" placeholder="e.g. 1, 2, 3">
      </label>
      <button onclick="buildNewTree()">Build Tree</button>
    </div>
  </div>

  <!-- Error Banner -->
  <div id="error-banner"></div>

  <!-- Controls Container -->
  <div style="display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;">
    
    <!-- Update Panel -->
    <div class="panel" style="margin: 0; max-width: 400px;">
      <div class="help-text">Update an array value at a specific index.</div>
      <div class="panel-row">
        <label>Index: <input type="number" id="idxInput" min="0" value="1"></label>
        <label>New Val: <input type="number" id="valInput" value="10"></label>
        <button onclick="updateValue()">Update Node</button>
      </div>
    </div>

    <!-- Query Panel -->
    <div class="panel" style="margin: 0; max-width: 450px;">
      <div class="help-text">Query the sum from index L to R.</div>
      <div class="panel-row">
        <label>L: <input type="number" id="lInput" min="0" value="1"></label>
        <label>R: <input type="number" id="rInput" min="0" value="4"></label>
        <button class="btn-query" onclick="queryRange()">Query Range</button>
        <div id="query-result"></div>
      </div>
      <div class="legend-text">
        <span class="legend-match">Solid Green = Total Overlap (Added)</span> | 
        <span class="legend-partial">Dashed Orange = Partial Overlap (Split)</span>
      </div>
    </div>
  </div>

  <div id="tree-container"></div>

  <script>
    let arr = [1, 3, 5, 7, 9, 11];
    let oldArr = null; 
    let activeQuery = null; 

    const isValidInteger = (str) => /^-?\d+$/.test(str);

    function showError(msg) {
      const banner = document.getElementById("error-banner");
      banner.innerText = msg;
      banner.style.display = "block";
    }

    function hideError() {
      document.getElementById("error-banner").style.display = "none";
    }

    function clearQueryUI() {
      activeQuery = null;
      document.getElementById("query-result").innerText = "";
    }

    function syncLimits() {
      document.getElementById("idxInput").max = arr.length - 1;
      document.getElementById("lInput").max = arr.length - 1;
      document.getElementById("rInput").max = arr.length - 1;
    }

    function buildNewTree() {
      hideError();
      const rawText = document.getElementById("arrInput").value;
      
      if (!rawText.trim()) return showError("Array cannot be empty.");

      const rawItems = rawText.split(',');
      const parsedArr = [];

      for (let i = 0; i < rawItems.length; i++) {
        const s = rawItems[i].trim();
        if (s === "") continue; 

        if (!isValidInteger(s)) return showError(`Invalid input at item "${s}". Please use only whole numbers.`);
        
        const num = parseInt(s, 10);
        if (num < -999 || num > 999) return showError(`Value ${num} is out of bounds (-999 to 999).`);

        parsedArr.push(num);
      }

      if (parsedArr.length < 1 || parsedArr.length > 16) return showError("Array size must be between 1 and 16.");

      arr = parsedArr;
      oldArr = null; 
      clearQueryUI();
      syncLimits();
      
      document.getElementById("idxInput").value = 0;
      document.getElementById("lInput").value = 0;
      document.getElementById("rInput").value = arr.length - 1;

      renderTree();
    }

    function updateValue() {
      hideError();
      clearQueryUI(); 
      
      const idxStr = document.getElementById("idxInput").value.trim();
      const valStr = document.getElementById("valInput").value.trim();
      
      if (!isValidInteger(idxStr) || !isValidInteger(valStr)) return showError("Invalid format! Numbers only.");

      const idx = parseInt(idxStr, 10);
      const val = parseInt(valStr, 10);
      
      if (idx < 0 || idx >= arr.length) return showError(`Index must be between 0 and ${arr.length - 1}.`);
      if (val < -999 || val > 999) return showError("New value must be between -999 and 999.");

      oldArr = [...arr];
      arr[idx] = val;    
      renderTree();      
    }

    function queryRange() {
      hideError();
      oldArr = null; 
      
      const lStr = document.getElementById("lInput").value.trim();
      const rStr = document.getElementById("rInput").value.trim();
      
      if (!isValidInteger(lStr) || !isValidInteger(rStr)) return showError("Invalid format! Numbers only.");

      const l = parseInt(lStr, 10);
      const r = parseInt(rStr, 10);
      
      if (l < 0 || r >= arr.length || l > r) {
        return showError(`Invalid Range. Ensure 0 <= L <= R <= ${arr.length - 1}.`);
      }

      activeQuery = { L: l, R: r };
      
      let sum = 0;
      for (let i = l; i <= r; i++) sum += arr[i];
      document.getElementById("query-result").innerText = `= ${sum}`;

      renderTree();
    }

    function getSum(array, l, r) {
      let sum = 0;
      for (let i = l; i <= r; i++) sum += array[i];
      return sum;
    }

    function buildTreeData(l, r) {
      const currentSum = getSum(arr, l, r);
      let isChanged = false;
      let prevSum = null;
      let qState = "none";

      if (oldArr && oldArr.length === arr.length) {
        const previousSum = getSum(oldArr, l, r);
        if (currentSum !== previousSum) {
          isChanged = true;
          prevSum = previousSum;
        }
      }

      if (activeQuery) {
        if (activeQuery.L <= l && activeQuery.R >= r) {
          qState = "match";   
        } else if (activeQuery.L > r || activeQuery.R < l) {
          qState = "miss";    
        } else {
          qState = "partial"; 
        }
      }

      const rangeStr = (l === r) ? `[${l}]` : `[${l}-${r}]`;

      if (l === r) {
        return { range: rangeStr, val: currentSum, changed: isChanged, prevSum: prevSum, qState: qState };
      }
      
      const mid = Math.floor((l + r) / 2);
      const left = buildTreeData(l, mid);
      const right = buildTreeData(mid + 1, r);
      
      return { 
        range: rangeStr, val: currentSum, children: [left, right], 
        changed: isChanged, prevSum: prevSum, qState: qState
      };
    }

    function renderTree() {
      d3.select("#tree-container").html("");
      if (arr.length === 0) return;

      const treeData = buildTreeData(0, arr.length - 1);

      const width = Math.max(900, arr.length * 120); 
      const height = 500;
      
      const svg = d3.select("#tree-container").append("svg")
                    .attr("width", width).attr("height", height)
                    .append("g").attr("transform", "translate(40,40)");

      const root = d3.hierarchy(treeData);
      const treeLayout = d3.tree().size([width - 80, height - 80]);
      treeLayout(root);

      svg.selectAll('.link').data(root.links()).enter().append('path')
         .attr('class', d => {
           if (activeQuery && d.target.data.qState === 'miss') return 'link q-miss';
           return 'link';
         })
         .attr('d', d3.linkVertical().x(d => d.x).y(d => d.y));

      const node = svg.selectAll('.node').data(root.descendants()).enter().append('g')
          .attr('class', d => {
             let c = 'node';
             if (d.data.changed) c += ' changed';
             if (d.data.qState === 'match') c += ' q-match';
             if (d.data.qState === 'partial') c += ' q-partial';
             if (d.data.qState === 'miss') c += ' q-miss';
             return c;
          })
          .attr('transform', d => `translate(${d.x},${d.y})`);
                      
      node.append('circle')
          .attr('r', 40) 
          .style('stroke', '#4fc3f7'); 

      node.append('text')
          .attr('class', 'range-text')
          .attr('dy', d => d.data.changed ? -14 : -8)
          .attr('text-anchor', 'middle')
          .text(d => d.data.range);

      node.append('text')
          .attr('class', 'main-text')
          .attr('dy', d => d.data.changed ? 4 : 8)
          .attr('text-anchor', 'middle')
          .text(d => d.data.val);

      node.filter(d => d.data.changed).append('text')
          .attr('class', 'prev-text')
          .attr('dy', 20)
          .attr('text-anchor', 'middle')
          .text(d => `(was ${d.data.prevSum})`);
    }

    syncLimits();
    renderTree();
  </script>
</body>
</html>
